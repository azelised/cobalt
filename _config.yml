# -----------------------
# Site settings
# -----------------------

title: "Cobalt"
description: >- # this means to ignore newlines until "baseurl:"
  "Cobalt, a lightweight and easy to learn UI framework for Roblox's Luau."
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# -----------------------
# Build settings
# -----------------------

theme: just-the-docs
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# -----------------------
# Appearance settings
# -----------------------

logo: "/assets/images/logo.png"

aux_links:
  "Cobalt on GitHub":
    - "//github.com"

aux_links_new_tab: true

color_scheme: purple
twitter_username: azelised
github_username: azelised

toc:
  enabled: true

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

